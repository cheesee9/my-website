# 保留原文件名以便识别迁移；项目不再发布到 GitHub Pages。
name: Next.js server build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --immutable --mode=skip-build
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - run: yarn test:agent
      - run: yarn lint
      - run: yarn build
